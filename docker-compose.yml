services:
  claude-project-design:
    build: .
    container_name: claude-project-design
    stdin_open: true
    tty: true
    working_dir: /workspace
    # manager が docker exec で操作できるよう常駐させる。
    # CMD ["bash"] のままだと非対話 stdin が即 EOF になり、up -d でコンテナが終了してしまう。
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - claude-project-design-config:/home/claude/.claude
      # workspaces/ 配下はこのリポジトリに含めている（.gitkeep で空フォルダを追跡）。
      # 相対パスにしないのは、manager がコンテナ内から `docker compose` を呼ぶとき
      # 自分の /compose-project という見え方を基準に解決してしまい、ホストに
      # 実在しないパスをバインドしようとするため（下の manager サービスの説明を参照）。
      # ${HOST_PROJECT_DIR} はこのリポジトリをクローンしたホスト側の絶対パス。
      # `.env`（`.env.example` をコピーして作る）で1箇所だけ設定すればよい。
      - ${HOST_PROJECT_DIR}/workspaces/design:/workspace
      # :ro 必須。UI からのタスクは bypassPermissions で無確認実行されるため、
      # 書き込み可能だとホストの ~/Project 配下を丸ごと破壊しうる。
      - ${HOME}/Project:/vault:ro
      # 設計 → 実装 → レビュー → テストで成果物を受け渡すための共有フォルダ（rw）。
      # 全プロジェクトコンテナ + manager 自身にも同じホストパスをマウントする。
      - ${HOME}/Project/.fleet-handoff:/handoff

  claude-project-implement:
    build: .
    container_name: claude-project-implement
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - claude-project-implement-config:/home/claude/.claude
      - ${HOST_PROJECT_DIR}/workspaces/implement:/workspace
      # :ro 必須。UI からのタスクは bypassPermissions で無確認実行されるため、
      # 書き込み可能だとホストの ~/Project 配下を丸ごと破壊しうる。
      - ${HOME}/Project:/vault:ro
      - ${HOME}/Project/.fleet-handoff:/handoff

  claude-project-test:
    build: .
    container_name: claude-project-test
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - claude-project-test-config:/home/claude/.claude
      - ${HOST_PROJECT_DIR}/workspaces/test:/workspace
      - ${HOME}/Project:/vault:ro
      - ${HOME}/Project/.fleet-handoff:/handoff

  claude-project-master:
    build: .
    container_name: claude-project-master
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - claude-project-master-config:/home/claude/.claude
      - ${HOST_PROJECT_DIR}/workspaces/master:/workspace
      - ${HOME}/Project:/vault:ro
      # 各工程の成果物を読み、判断結果（decision-*.json）を書き出すための共有フォルダ。
      - ${HOME}/Project/.fleet-handoff:/handoff

  manager:
    build: ./manager
    container_name: claude-manager
    restart: unless-stopped
    # 認証機構を持たないため、必ず 127.0.0.1 限定で公開する。
    ports:
      - "127.0.0.1:4590:4590"
    environment:
      - PORT=4590
      # 設定UI から `docker compose` を呼ぶとき、compose ファイル中の ${HOME} を
      # manager コンテナ自身の HOME ではなくホストの実際の $HOME で展開させるために使う。
      - HOST_HOME=${HOME}
      # パイプラインのマスター自動運転の暴走防止しきい値（任意・既定値のままで良ければ不要）。
      # - PIPELINE_MAX_CONSECUTIVE_REJECTS=3
      # - PIPELINE_MAX_AUTO_HOPS=12
      # 任意の共有トークン認証（既定は無効）。SSH トンネル越しなど 127.0.0.1 以外の
      # 経路から到達しうる運用をする場合の追加の保険として設定する。
      # 設定すると /api への全アクセスにこのトークンを要求する（README のセキュリティ上の注意を参照）。
      # - FLEET_CONSOLE_TOKEN=change-me-to-a-long-random-string
    # docker.sock はホストの root 相当の権限。manager 以外には渡さないこと。
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 設定UI から docker-compose.yml / containers.config.json を編集・反映するために
      # プロジェクトルートを読み書き可能でマウントする。
      #
      # 相対パス（"." や ${PWD}）にしてはいけない: manager 自身が
      # `docker compose` を呼ぶとき、CLI はこの行を自分の /compose-project
      # という「見え方」（あるいは manager プロセス自身の PWD）を基準に解決
      # してしまい、ホストに実在しないパスをバインドしようとして自分自身を
      # 壊れた状態で再作成してしまう（実際に起きた障害）。絶対パスで固定する
      # 必要があるため ${HOST_PROJECT_DIR} を使う（上の各サービスと同じ変数。
      # `.env` の1箇所を直せば、ここも含めて全サービスに反映される）。
      - ${HOST_PROJECT_DIR}:/compose-project
      # プロジェクトコンテナと同じホストパスを manager 自身にもマウントし、
      # 各コンテナが停止していても handoff 成果物を fs で直接読み書きできるようにする。
      - ${HOME}/Project/.fleet-handoff:/handoff
    depends_on:
      - claude-project-design
      - claude-project-implement
      - claude-project-review
      - claude-project-test
      - claude-project-master

  claude-project-review:
    build: .
    container_name: claude-project-review
    stdin_open: true
    tty: true
    working_dir: /workspace
    command: ["tail", "-f", "/dev/null"]
    restart: unless-stopped
    volumes:
      - claude-project-review-config:/home/claude/.claude
      - ${HOST_PROJECT_DIR}/workspaces/review:/workspace
      - ${HOME}/Project:/vault:ro
      - ${HOME}/Project/.fleet-handoff:/handoff

volumes:
  claude-project-design-config:
  claude-project-implement-config:
  claude-project-review-config:
  claude-project-test-config:
  claude-project-master-config:
